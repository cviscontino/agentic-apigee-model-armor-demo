  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const CHART_COLORS = [
      "#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6",
      "#ec4899", "#06b6d4", "#84cc16", "#f97316", "#6366f1"
    ];

    function formatDateReadable(isoStr) {
      if (!isoStr) return "—";
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const m = months[d.getUTCMonth()];
        const day = String(d.getUTCDate()).padStart(2, "0");
        const yr = d.getUTCFullYear();
        const hh = String(d.getUTCHours()).padStart(2, "0");
        const mm = String(d.getUTCMinutes()).padStart(2, "0");
        return `${m} ${day}, ${yr} ${hh}:${mm}`;
      } catch {
        return isoStr;
      }
    }

    function formatEur(val) {
      const n = Number(val || 0);
      return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
    }

    // Reusable ECharts Wrapper Component
    function EChartBox({ option, height = "340px", isDark }) {
      const chartRef = useRef(null);
      const instanceRef = useRef(null);

      useEffect(() => {
        if (!chartRef.current) return;
        if (instanceRef.current) {
          instanceRef.current.dispose();
        }
        const chart = echarts.init(chartRef.current, isDark ? "dark" : null, { renderer: "canvas" });
        instanceRef.current = chart;
        chart.setOption({
          backgroundColor: "transparent",
          ...option,
        });

        const handleResize = () => chart && chart.resize();
        window.addEventListener("resize", handleResize);
        return () => {
          window.removeEventListener("resize", handleResize);
          chart.dispose();
        };
      }, [option, isDark]);

      return <div ref={chartRef} style={{ width: "100%", height }} />;
    }

    // SVG Icon Helper
    function Icon({ name, className = "w-4 h-4" }) {

        terminal: <><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></>,
        checkCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></>,
        alertTriangle: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></>,
        refresh: <><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></>,
      };
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"

          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {paths[name] || paths.shield}

    }

    function App() {
      const [isDark, setIsDark] = useState(true);
      const [scenarios, setScenarios] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [gatewayMetrics, setGatewayMetrics] = useState({
        total_requests: 14,
        allowed_requests: 9,
        blocked_model_armor: 3,
        throttled_apigee_429: 2,
        semantic_cache_hits: 2,
        a2a_tasks_dispatched: 18,
        bq_mcp_queries_executed: 18,
        tokens_consumed: 6420,
      });
      const [gatewayConfig, setGatewayConfig] = useState({
        authenticated_user: "admin@cviscontino.altostrat.com",
        spike_arrest_rpm: 15,
        token_quota_per_min: 1500,
        semantic_cache_enabled: true,
        sdp_mask_iban_output: true,
        apigee_endpoint: "https://api.cvisco-agentic-demo.internal/v1/agentic-fsi (PSC 10.10.0.50)",
        model_armor_template: "projects/cvisco-agentic-demo/locations/europe-west1/templates/fsi-agent-armor-strict",
      });
      const [userTokenQuota, setUserTokenQuota] = useState({
        policy_type: "LLMTokenQuota (Apigee Out-of-the-Box AI Policy)",
        enforce_policy: "Q-TokenQuota-Enforce (EnforceOnly=true)",
        count_policy: "Q-TokenQuota-Count (CountOnly=true)",
        shared_counter: "user-gemini-token-counter",
        identifier_ref: "extracted.userEmail",
        identifier_value: "admin@cviscontino.altostrat.com",
        token_usage_source: "$.usageMetadata.totalTokenCount",
        allowed_tokens: 1500,
        used_tokens: 0,
        available_tokens: 1500,
        prompt_tokens_window: 0,
        candidates_tokens_window: 0,
        calls_in_window: 0,
        reset_in_seconds: 60,
        quota_exceeded: false,
      });

      // Active Simulator Controls
      const [activeModeTab, setActiveModeTab] = useState("VALID_A2A_MCP"); // VALID_A2A_MCP | MODEL_ARMOR_BLOCKED | STRESS_TEST
      const [selectedScenarioId, setSelectedScenarioId] = useState("valid_aml_structuring");
      const [customPrompt, setCustomPrompt] = useState(
        "Analizza le transazioni SWIFT ad alto rischio (>85) con sospetto Cross-Border Structuring e incrocia i risultati con lo stato PEP, screening OFAC e alert EU AMLD6 dei clienti su BigQuery."
      );
      const [bypassCache, setBypassCache] = useState(false);
      const [isInvoking, setIsInvoking] = useState(false);
      const [lastTrace, setLastTrace] = useState(null);
      const [activeInspectorTab, setActiveInspectorTab] = useState("ge_synthesis"); // ge_synthesis | gemini_quota | model_armor | a2a_jsonrpc | bq_mcp

      // Stress Test Controls & Results
      const [stressTotalReq, setStressTotalReq] = useState(24);
      const [stressConcurrency, setStressConcurrency] = useState(8);
      const [stressSpikeLimit, setStressSpikeLimit] = useState(15);
      const [stressProfile, setStressProfile] = useState("mixed_realistic");
      const [isRunningStress, setIsRunningStress] = useState(false);
      const [stressResult, setStressResult] = useState(null);

      // Table Filtering, Selection & Pagination
      const [statusFilter, setStatusFilter] = useState("ALL");
      const [channelFilter, setChannelFilter] = useState("ALL");
      const [typologyFilter, setTypologyFilter] = useState("ALL");
      const [openDropdown, setOpenDropdown] = useState(null); // "status" | "channel" | "typology" | null
      const [selectedTx, setSelectedTx] = useState(null);
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 6;
      const [isActionLoading, setIsActionLoading] = useState(false);

      // Modal for Gateway & A2A AgentCard inspection
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [agentCardModal, setAgentCardModal] = useState(null);

      // Toggle Dark Mode on HTML root
      useEffect(() => {
        const root = document.documentElement;
        if (isDark) {
          root.classList.add("dark");
        } else {
          root.classList.remove("dark");
        }
      }, [isDark]);

      const loadInitialData = useCallback(async (forceRefresh = false) => {
        try {
          const [scenRes, bqRes] = await Promise.all([
            fetch("/api/scenarios").then((r) => r.json()),
            fetch(`/api/bq/dashboard?refresh=${forceRefresh}`).then((r) => r.json()),
          ]);
          if (scenRes.scenarios) setScenarios(scenRes.scenarios);
          if (scenRes.user_token_quota) setUserTokenQuota(scenRes.user_token_quota);
          if (bqRes.transactions) setTransactions(bqRes.transactions);
          if (bqRes.gateway_metrics) setGatewayMetrics(bqRes.gateway_metrics);
          if (bqRes.gateway_config) setGatewayConfig(bqRes.gateway_config);
          if (bqRes.user_token_quota) setUserTokenQuota(bqRes.user_token_quota);
        } catch (err) {
          console.error("Failed loading initial data:", err);
        }
      }, []);

      useEffect(() => {
        loadInitialData(false);
      }, [loadInitialData]);

      // Automatically run an initial valid call so the trace inspector is populated on first view
      useEffect(() => {
        const timer = setTimeout(() => {
          handleInvokeGateway(
            "Analizza le transazioni SWIFT ad alto rischio (>85) con sospetto Cross-Border Structuring e incrocia i risultati con lo stato PEP, screening OFAC e alert EU AMLD6 dei clienti su BigQuery.",
            "valid_aml_structuring",
            null
          );
        }, 300);
        return () => clearTimeout(timer);
      }, []);

      const handleSelectScenario = (sc) => {
        setSelectedScenarioId(sc.id);
        setCustomPrompt(sc.prompt);
      };

      const handleResetTokenQuota = async () => {
        try {
          const res = await fetch("/api/gateway/reset-quota", { method: "POST" });
          const data = await res.json();
          if (data.user_token_quota) setUserTokenQuota(data.user_token_quota);
        } catch (err) {
          console.error("Reset token quota error:", err);
        }
      };

      const handleUpdateTokenLimitQuick = async (newLimit) => {
        const lim = Math.max(100, Number(newLimit) || 1500);
        setGatewayConfig((prev) => ({ ...prev, token_quota_per_min: lim }));
        try {
          const res = await fetch("/api/gateway/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token_quota_per_min: lim }),
          });
          const data = await res.json();
          if (data.config) setGatewayConfig(data.config);
          if (data.user_token_quota) setUserTokenQuota(data.user_token_quota);
        } catch (err) {
          console.error("Update token limit error:", err);
        }
      };

      const handleInvokeGateway = async (promptOverride, scenarioIdOverride, customerFilterOverride, bypassCacheOverride) => {
        const promptToUse = promptOverride !== undefined ? promptOverride : customPrompt;
        if (!promptToUse.trim()) return;
        setIsInvoking(true);
        try {
          const matchedScenario = scenarios.find((s) => s.id === (scenarioIdOverride || selectedScenarioId));
          const res = await fetch("/api/gateway/invoke", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              prompt: promptToUse,
              scenario_id: scenarioIdOverride || selectedScenarioId,
              user_email: gatewayConfig.authenticated_user || "admin@cviscontino.altostrat.com",
              customer_filter: customerFilterOverride !== undefined ? customerFilterOverride : (matchedScenario?.customer_filter || null),
              bypass_cache: bypassCacheOverride !== undefined ? bypassCacheOverride : bypassCache,
            }),
          });
          const data = await res.json();
          setLastTrace(data);
          if (data.user_token_quota) setUserTokenQuota(data.user_token_quota);
          if (data.verdict === "MODEL_ARMOR_BLOCKED") {
            setActiveInspectorTab("model_armor");
          } else if (data.verdict === "APIGEE_LLM_TOKEN_QUOTA_429") {
            setActiveInspectorTab("gemini_quota");
          } else {
            setActiveInspectorTab("ge_synthesis");
          }
          // Refresh metrics
          const scenRes = await fetch("/api/scenarios").then((r) => r.json());
          if (scenRes.gateway_metrics) setGatewayMetrics(scenRes.gateway_metrics);
          if (scenRes.user_token_quota) setUserTokenQuota(scenRes.user_token_quota);
        } catch (err) {
          console.error("Gateway invoke error:", err);
        } finally {
          setIsInvoking(false);
        }
      };

      const handleRunStressTest = async () => {
        setIsRunningStress(true);
        try {
          const res = await fetch("/api/gateway/stress-test", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              total_requests: Number(stressTotalReq),
              concurrency: Number(stressConcurrency),
              spike_arrest_limit_rpm: Number(stressSpikeLimit),
              traffic_profile: stressProfile,
            }),
          });
          const data = await res.json();
          setStressResult(data);
          if (data.gateway_metrics) setGatewayMetrics(data.gateway_metrics);
          if (data.user_token_quota) setUserTokenQuota(data.user_token_quota);
        } catch (err) {
          console.error("Stress test error:", err);
        } finally {
          setIsRunningStress(false);
        }
      };

      const handleAnalystAction = async (txId, action) => {
        setIsActionLoading(true);
        try {
          const res = await fetch(`/api/transaction/${txId}/action`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action }),
          });
          const updated = await res.json();
          setTransactions((prev) =>
            prev.map((row) =>
              row.tx_id === txId
                ? { ...row, status: updated.status, resolution_status: updated.resolution_status }
                : row
            )
          );
          if (selectedTx && selectedTx.tx_id === txId) {
            setSelectedTx((prev) => ({
              ...prev,
              status: updated.status,
              resolution_status: updated.resolution_status,
            }));
          }
        } catch (err) {
          console.error("Failed updating transaction:", err);
        } finally {
          setIsActionLoading(false);
        }
      };

      const handleViewAgentCard = async (agentPath) => {
        try {
          const res = await fetch(`/a2a/${agentPath}/.well-known/agent.json`);
          const card = await res.json();
          setAgentCardModal(card);
        } catch (e) {
          console.error(e);
        }
      };

      // Filtered Transactions for Primary Data Table
      const filteredTransactions = useMemo(() => {
        return transactions.filter((t) => {
          if (statusFilter !== "ALL" && t.status !== statusFilter) return false;
          if (channelFilter !== "ALL" && t.channel !== channelFilter) return false;
          if (typologyFilter !== "ALL" && t.fraud_typology !== typologyFilter) return false;
          return true;
        });
      }, [transactions, statusFilter, channelFilter, typologyFilter]);

      const totalPages = Math.max(1, Math.ceil(filteredTransactions.length / pageSize));
      const paginatedTransactions = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return filteredTransactions.slice(start, start + pageSize);
      }, [filteredTransactions, currentPage]);

      const totalSuspiciousEur = useMemo(() => {
        return transactions
          .filter((t) => Number(t.risk_score) >= 75 || t.status === "FLAGGED" || t.status === "BLOCKED")
          .reduce((acc, t) => acc + Number(t.amount_eur || 0), 0);
      }, [transactions]);

      // ECharts Option 1: BigQuery Fraud Volume & Risk Score by Transaction & Typology
      const bqFraudChartOption = useMemo(() => {
        const sorted = [...transactions].sort((a, b) => Number(b.risk_score) - Number(a.risk_score));
        const labels = sorted.map((t) => `${t.tx_id} (${t.country_code})`);
        const amounts = sorted.map((t) => Math.round(Number(t.amount_eur || 0) / 1000));
        const scores = sorted.map((t) => Number(t.risk_score || 0));

        return {
          color: [CHART_COLORS[0], CHART_COLORS[3]],
          textStyle: { fontFamily: "DM Sans, Inter, sans-serif" },
          tooltip: {
            trigger: "axis",
            backgroundColor: "rgba(255, 255, 255, 0.96)",
            borderColor: "#e2e8f0",
            textStyle: { color: "#0f172a", fontSize: 12 },
          },
          legend: {
            data: ["Importo Transazione (k€)", "Fraud Risk Score (0-100)"],
            top: 4,
            textStyle: { color: isDark ? "#a1a1aa" : "#52525b" },
          },
          grid: { left: "4%", right: "4%", bottom: "10%", top: "16%", containLabel: true },
          xAxis: {
            type: "category",
            data: labels,
            axisLabel: { color: isDark ? "#a1a1aa" : "#52525b", rotate: 20, fontSize: 11 },
            axisLine: { lineStyle: { color: isDark ? "#27272a" : "#e4e4e7" } },
          },
          yAxis: [
            {
              type: "value",
              name: "Volume (k€)",
              nameTextStyle: { color: isDark ? "#a1a1aa" : "#52525b" },
              axisLabel: { color: isDark ? "#a1a1aa" : "#52525b", formatter: "€{value}k" },
              splitLine: { lineStyle: { color: isDark ? "#1e1e24" : "#f4f4f5" } },
            },
            {
              type: "value",
              name: "Risk Score",
              min: 0,
              max: 100,
              nameTextStyle: { color: isDark ? "#a1a1aa" : "#52525b" },
              axisLabel: { color: isDark ? "#a1a1aa" : "#52525b" },
              splitLine: { show: false },
            },
          ],
          series: [
            {
              name: "Importo Transazione (k€)",
              type: "bar",
              barMaxWidth: 32,
              itemStyle: { borderRadius: [4, 4, 0, 0] },
              data: amounts,
            },
            {
              name: "Fraud Risk Score (0-100)",

                  </button>

                  {/* Action Buttons (Approve / Reject-Block) */}
                  <div className="pt-2 border-t border-zinc-200 dark:border-zinc-800 grid grid-cols-2 gap-2.5">
                    <button
                      onClick={() => handleAnalystAction(selectedTx.tx_id, "APPROVE")}
                      disabled={isActionLoading}
                      className="bg-emerald-500 hover:bg-emerald-600 text-white rounded-[8px] px-[12px] py-[8px] text-xs font-semibold transition-colors shadow-sm disabled:opacity-50"
                    >
                      Approva (SETTLED)
                    </button>
                    <button
                      onClick={() => handleAnalystAction(selectedTx.tx_id, "BLOCK")}
                      disabled={isActionLoading}
                      className="bg-rose-500 hover:bg-rose-600 text-white rounded-[8px] px-[12px] py-[8px] text-xs font-semibold transition-colors shadow-sm disabled:opacity-50"
                    >
                      Blocca &amp; SAR (BLOCKED)
                    </button>
                  </div>
                </div>
              )}
            </div>
          </section>

          {/* 6. APACHE ECHARTS ANALYTICAL VISUALIZATIONS (1 CHART PER ROW: grid-cols-1) */}
          <section className="grid grid-cols-1 gap-6">
            {/* Chart 1 */}
            <div className="bg-white dark:bg-[#0c0c0f] rounded-xl border border-zinc-200 dark:border-zinc-800 p-5 shadow-sm">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                <div>
                  <h3 className="text-base font-bold text-zinc-950 dark:text-zinc-50">
                    Analisi BigQuery MCP: Volume Transazioni (k€) vs Fraud Risk Score per Operazione
                  </h3>
                  <p className="text-xs text-zinc-500 dark:text-zinc-400">
                    Dati interrogati dall'Agente A2A #1 (`transaction_risk_analytics_agent`) sulla tabella `my-ca-test-486412.agentic_fsi_fraud_demo.transactions_ledger`.
                  </p>
                </div>
                <span className="font-mono text-xs text-zinc-500 bg-zinc-100 dark:bg-zinc-800 rounded px-2 py-1">
                  MCP Tool: execute_sql_readonly
                </span>
              </div>
              <EChartBox option={bqFraudChartOption} height="340px" isDark={isDark} />
            </div>

            {/* Chart 2 */}
            <div className="bg-white dark:bg-[#0c0c0f] rounded-xl border border-zinc-200 dark:border-zinc-800 p-5 shadow-sm">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                <div>
                  <h3 className="text-base font-bold text-zinc-950 dark:text-zinc-50">
                    {stressResult
                      ? `Risultati Stress Test Concorrente Apigee & Model Armor (${stressResult.summary.total_sent} Richieste)`
                      : "Profilo di Latenza per Hop: Chiamata Multi-Agente Valida vs Blocco Edge Cloud Model Armor"}
                  </h3>
                  <p className="text-xs text-zinc-500 dark:text-zinc-400">
                    {stressResult
                      ? `Token LLM risparmiati grazie a Model Armor + Apigee SpikeArrest + Semantic Cache: ${stressResult.summary.total_tokens_saved} token (${stressResult.summary.bq_queries_prevented} query BigQuery MCP evitate).`
                      : "Dimostra come Model Armor fermi i prompt ostili in ~27ms sull'edge Apigee prima di invocare Gemini Enterprise, i 2 Agenti A2A e BigQuery MCP."}
                  </p>
                </div>
                {stressResult && (
                  <button
                    onClick={() => setStressResult(null)}
                    className="text-xs text-blue-500 hover:underline font-mono"
                  >
                    Mostra Confronto Hop Standard
                  </button>
                )}
              </div>
              <EChartBox option={gatewayTelemetryChartOption} height="340px" isDark={isDark} />
            </div>
          </section>

          {/* MODAL: A2A AgentCard Viewer */}
          {agentCardModal && (
            <div className="fixed inset-0 bg-zinc-950/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#ffffff] dark:bg-[#0c0c0f] rounded-[12px] border border-zinc-200 dark:border-zinc-800 shadow-xl w-full max-w-2xl p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 pb-3">
                  <div>
                    <span className="text-xs font-mono text-blue-500 uppercase">A2A Discovery Protocol (/.well-known/agent.json)</span>
                    <h3 className="text-lg font-bold text-zinc-950 dark:text-zinc-50">{agentCardModal.name}</h3>
                  </div>
                  <button onClick={() => setAgentCardModal(null)} className="p-1 text-zinc-400 hover:text-zinc-200">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => handleViewAgentCard("transaction-risk")}
                    className="text-xs font-mono px-3 py-1.5 rounded border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800"
                  >
                    Agente #1: Transaction &amp; Risk
                  </button>
                  <button
                    onClick={() => handleViewAgentCard("compliance-portfolio")}
                    className="text-xs font-mono px-3 py-1.5 rounded border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800"
                  >
                    Agente #2: Compliance &amp; Portfolio
                  </button>
                </div>
                <pre className="bg-zinc-950 text-zinc-100 p-4 rounded-lg text-xs font-mono overflow-x-auto max-h-[380px] border border-zinc-800">
                  {JSON.stringify(agentCardModal, null, 2)}
                </pre>
              </div>
            </div>
          )}

          {/* MODAL: Apigee & Model Armor Policy Configuration */}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-zinc-950/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-[#ffffff] dark:bg-[#0c0c0f] rounded-[12px] border border-zinc-200 dark:border-zinc-800 shadow-xl w-full max-w-md p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 pb-3">
                  <h3 className="text-base font-bold text-zinc-950 dark:text-zinc-50">
                    Configurazione Apigee X &amp; Cloud Model Armor
                  </h3>
                  <button onClick={() => setShowSettingsModal(false)} className="p-1 text-zinc-400 hover:text-zinc-200">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-xs font-medium text-zinc-500 mb-1">
                      Apigee Proxy Endpoint URL
                    </label>
                    <input
                      type="text"
                      value={gatewayConfig.apigee_endpoint}
                      onChange={(e) => setGatewayConfig({ ...gatewayConfig, apigee_endpoint: e.target.value })}
                      className="w-full bg-[#ffffff] dark:bg-[#09090b] border border-zinc-200 dark:border-zinc-800 rounded-[8px] px-[12px] py-[8px] text-xs font-mono text-zinc-950 dark:text-zinc-100"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-zinc-500 mb-1">
                      Cloud Model Armor Template Resource
                    </label>
                    <input
                      type="text"
                      value={gatewayConfig.model_armor_template}
                      onChange={(e) => setGatewayConfig({ ...gatewayConfig, model_armor_template: e.target.value })}
                      className="w-full bg-[#ffffff] dark:bg-[#09090b] border border-zinc-200 dark:border-zinc-800 rounded-[8px] px-[12px] py-[8px] text-xs font-mono text-zinc-950 dark:text-zinc-100"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-zinc-500 mb-1">
                      Utente Autenticato (`&lt;Identifier ref="extracted.userEmail"/&gt;`)
                    </label>
                    <input
                      type="text"
                      value={gatewayConfig.authenticated_user || "admin@cviscontino.altostrat.com"}
                      onChange={(e) => setGatewayConfig({ ...gatewayConfig, authenticated_user: e.target.value })}
                      className="w-full bg-[#ffffff] dark:bg-[#09090b] border border-zinc-200 dark:border-zinc-800 rounded-[8px] px-[12px] py-[8px] text-xs font-mono text-zinc-950 dark:text-zinc-100"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-zinc-500 mb-1">
                        Apigee `&lt;LLMTokenQuota&gt;` (tok/min)
                      </label>
                      <input
                        type="number"
                        value={gatewayConfig.token_quota_per_min || 1500}
                        onChange={(e) => setGatewayConfig({ ...gatewayConfig, token_quota_per_min: Number(e.target.value) })}
                        className="w-full bg-[#ffffff] dark:bg-[#09090b] border border-zinc-200 dark:border-zinc-800 rounded-[8px] px-[12px] py-[8px] text-xs font-mono text-zinc-950 dark:text-zinc-100"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-zinc-500 mb-1">
                        SpikeArrest (req/min)
                      </label>
                      <input
                        type="number"
                        value={gatewayConfig.spike_arrest_rpm}
                        onChange={(e) => setGatewayConfig({ ...gatewayConfig, spike_arrest_rpm: Number(e.target.value) })}
                        className="w-full bg-[#ffffff] dark:bg-[#09090b] border border-zinc-200 dark:border-zinc-800 rounded-[8px] px-[12px] py-[8px] text-xs font-mono text-zinc-950 dark:text-zinc-100"
                      />
                    </div>
                  </div>
                  <label className="flex items-center gap-2 pt-1 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={gatewayConfig.semantic_cache_enabled}
                      onChange={(e) => setGatewayConfig({ ...gatewayConfig, semantic_cache_enabled: e.target.checked })}
                      className="rounded accent-blue-500"
                    />
                    <span>Abilita Apigee Semantic Caching</span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={gatewayConfig.sdp_mask_iban_output}
                      onChange={(e) => setGatewayConfig({ ...gatewayConfig, sdp_mask_iban_output: e.target.checked })}
                      className="rounded accent-blue-500"
                    />
                    <span>Abilita Mascheramento SDP IBAN in Output (Model Armor)</span>
                  </label>
                </div>

                <div className="pt-3 border-t border-zinc-200 dark:border-zinc-800 flex justify-end gap-2">
                  <button
                    onClick={async () => {
                      const res = await fetch("/api/gateway/config", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(gatewayConfig),
                      });
                      const data = await res.json();
                      if (data.user_token_quota) setUserTokenQuota(data.user_token_quota);
                      setShowSettingsModal(false);
                    }}
                    className="bg-[#059669] hover:bg-[#047857] text-[#000000] rounded-[8px] px-[16px] py-[8px] text-xs font-semibold transition-colors shadow-sm"
                  >
                    Salva Policy
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
